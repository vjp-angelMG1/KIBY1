<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiby - Plataforma de Módulos</title>
    <style>

        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --secondary-color: #64748b;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-light: #64748b;
            --danger: #ef4444;
            --success: #10b981;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius: 12px;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
            font-family: inherit;
            transition: var(--transition);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            box-shadow: var(--shadow-sm);
        }
        .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-1px); }

        .btn-secondary {
            background-color: white;
            color: var(--text-main);
            border: 1px solid #e2e8f0;
        }
        .btn-secondary:hover { background-color: #f1f5f9; }

        .btn-danger {
            background-color: #fee2e2;
            color: var(--danger);
        }
        .btn-danger:hover { background-color: #fecaca; }

        .btn-icon {
            padding: 0.5rem;
            border-radius: 6px;
        }

        input, textarea, select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 1rem;
            transition: var(--transition);
            font-family: inherit;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        header {
            background: var(--card-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-link {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: var(--transition);
        }
        .nav-link:hover, .nav-link.active {
            color: var(--primary-color);
            background-color: #eef2ff;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            width: 100%;
            flex: 1;
        }

        .section-view {
            display: none; 
            animation: fadeIn 0.4s ease-in-out;
        }
        .section-view.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .login-card {
            background: white;
            padding: 3rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .login-card h2 { margin-bottom: 0.5rem; color: var(--text-main); }
        .login-card p { color: var(--text-light); margin-bottom: 2rem; }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .dashboard-header h1 { font-size: 1.8rem; }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .module-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            border: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .module-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .card-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background-color: #e2e8f0;
        }

        .card-content {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
        .card-desc { color: var(--text-light); font-size: 0.9rem; line-height: 1.5; flex: 1; }
        .card-footer { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }

        .detail-header {
            position: relative;
            height: 250px;
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 2rem;
        }
        .detail-img { width: 100%; height: 100%; object-fit: cover; }
        .detail-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 2rem;
            color: white;
        }
        .detail-overlay h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .detail-content { background: white; padding: 2rem; border-radius: var(--radius); box-shadow: var(--shadow-sm); }

        .admin-toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1rem;
        }

        .table-container {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #f1f5f9;
        }
        th { background-color: #f8fafc; font-weight: 600; color: var(--text-light); }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #fcfcfc; }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 600;
            background-color: #dcfce7;
            color: #166534;
        }

        .modal-backdrop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            opacity: 0; pointer-events: none;
            transition: var(--transition);
        }
        .modal-backdrop.open { opacity: 1; pointer-events: auto; }
        
        .modal {
            background: white;
            padding: 2rem;
            border-radius: var(--radius);
            width: 90%; max-width: 500px;
            transform: translateY(20px);
            transition: var(--transition);
        }
        .modal-backdrop.open .modal { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 1.5rem; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem; }

        #toast-container {
            position: fixed; bottom: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 10px;
            z-index: 2000;
        }
        .toast {
            background: #1e293b; color: white;
            padding: 1rem 1.5rem; border-radius: 8px;
            box-shadow: var(--shadow-lg);
            animation: slideIn 0.3s ease;
            display: flex; align-items: center; gap: 10px;
        }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .hidden { display: none !important; }
        .text-right { text-align: right; }
    </style>
</head>
<body>

    <header id="app-header" class="hidden">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
            Kiby
        </div>
        <nav class="nav-links">
            <a href="#" class="nav-link active" data-target="dashboard">Módulos</a>
            <a href="#" class="nav-link" data-target="admin">Admin</a>
            <a href="#" id="logout-btn" class="nav-link" style="color: var(--danger);">Cerrar Sesión</a>
        </nav>
    </header>

    <div class="main-container">

        <section id="login-view" class="section-view active">
            <div class="login-wrapper">
                <div class="login-card">
                    <h2>Bienvenido a Kiby</h2>
                    <p>Gestiona tu formación y módulos</p>
                    <form id="login-form">
                        <input type="email" id="email" placeholder="ejemplo@kiby.com" required>
                        <input type="password" id="password" placeholder="Contraseña" required>
                        <button type="submit" class="btn btn-primary" style="width: 100%">ENTRAR</button>
                    </form>
                    <p id="error-msg" style="color: var(--danger); font-size: 0.9rem; margin-top: 1rem; display: none;"></p>
                </div>
            </div>
        </section>

        <section id="dashboard-view" class="section-view">
            <div class="dashboard-header">
                <div>
                    <h1>Catálogo de Módulos</h1>
                    <p style="color: var(--text-light)">Selecciona un módulo para comenzar a aprender</p>
                </div>

                <button onclick="app.renderDashboard()" class="btn btn-secondary btn-icon" title="Actualizar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                </button>
            </div>

            <div id="modules-container" class="modules-grid">
            </div>
            <div id="loading-dashboard" style="text-align: center; color: var(--text-light);">Cargando módulos...</div>
        </section>

        <section id="detail-view" class="section-view">
            <button onclick="app.router('dashboard')" class="btn btn-secondary" style="margin-bottom: 1rem;">
                &larr; Volver al listado
            </button>
            
            <div id="detail-content-wrapper">
            </div>
        </section>

        <section id="admin-view" class="section-view">
            <div class="dashboard-header">
                <div>
                    <h1>Administración de Módulos</h1>
                    <p style="color: var(--text-light)">Gestiona el contenido del catálogo</p>
                </div>
                <button onclick="admin.openModal()" class="btn btn-primary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Nuevo Módulo
                </button>
            </div>

            <div class="table-container">
                <table id="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Imagen</th>
                            <th>Título</th>
                            <th>Descripción</th>
                            <th class="text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body">

                    </tbody>
                </table>
            </div>
        </section>

    </div>


    <div id="crud-modal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Nuevo Módulo</h3>
                <button onclick="admin.closeModal()" class="btn btn-icon btn-secondary">&times;</button>
            </div>
            <form id="module-form">
                <input type="hidden" id="module-id">
                
                <label style="font-size: 0.9rem; font-weight: 600;">Título del Módulo</label>
                <input type="text" id="input-title" placeholder="Ej: Introducción a Kiby" required>

                <label style="font-size: 0.9rem; font-weight: 600;">Descripción</label>
                <textarea id="input-desc" rows="3" placeholder="Breve descripción..." required></textarea>

                <label style="font-size: 0.9rem; font-weight: 600;">URL de Imagen</label>
                <input type="url" id="input-img" placeholder="https://..." required>
                
                <div class="modal-footer">
                    <button type="button" onclick="admin.closeModal()" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCS2rwV6tVSjC1Qq1wbGwxw-CC463aySg",
            authDomain: "kiby-cce29.firebaseapp.com",
            projectId: "kiby-cce29",
            storageBucket: "kiby-cce29.firebasestorage.app",
            messagingSenderId: "943084875353",
            appId: "1:943084875353:web:a996c38bd9baa52a4f4b48",
            measurementId: "G-LCWTC4R9RM"
        };

        const appFirebase = initializeApp(firebaseConfig);
        const auth = getAuth(appFirebase);

        const DEFAULT_MODULES = [
            { id: 1, title: "Introducción a Kiby", desc: "Aprende los fundamentos básicos de la plataforma y cómo empezar.", img: "https://picsum.photos/seed/kiby1/400/200" },
            { id: 2, title: "Gestión de Usuarios", desc: "Cómo crear cuentas nuevas y gestionar permisos.", img: "https://picsum.photos/seed/kiby2/400/200" },
            { id: 3, title: "Reportes Avanzados", desc: "Extrae datos y crea gráficos detallados.", img: "https://picsum.photos/seed/kiby3/400/200" },
            { id: 4, title: "Configuración API", desc: "Conecta Kiby con otros servicios externos.", img: "https://picsum.photos/seed/kiby4/400/200" },
            { id: 5, title: "Seguridad y Copias", desc: "Mantén tus datos a salvo con copias de seguridad.", img: "https://picsum.photos/seed/kiby5/400/200" }
        ];
        
        const DataService = {
            getModules: () => {
                const data = localStorage.getItem('kiby_modules');
                return data ? JSON.parse(data) : DEFAULT_MODULES;
            },
            saveModules: (modules) => {
                localStorage.setItem('kiby_modules', JSON.stringify(modules));
            },
            add: (mod) => {
                const list = DataService.getModules();
                const newId = Date.now(); // ID simple basado en timestamp
                list.push({ ...mod, id: newId });
                DataService.saveModules(list);
            },
            update: (updatedMod) => {
                let list = DataService.getModules();
                list = list.map(m => m.id == updatedMod.id ? updatedMod : m);
                DataService.saveModules(list);
            },
            delete: (id) => {
                let list = DataService.getModules();
                list = list.filter(m => m.id != id);
                DataService.saveModules(list);
            }
        };

        // Inicializar si está vacío
        if (!localStorage.getItem('kiby_modules')) {
            DataService.saveModules(DEFAULT_MODULES);
        }

        // 3. UTILIDADES UI
        const UI = {
            toast: (msg, type = 'success') => {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `<span>${type === 'success' ? '✔' : '✖'}</span> ${msg}`;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            },
            showView: (viewId) => {
                document.querySelectorAll('.section-view').forEach(el => el.classList.remove('active'));
                document.getElementById(`${viewId}-view`).classList.add('active');
                
                // Actualizar nav links
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                const activeLink = document.querySelector(`.nav-link[data-target="${viewId}"]`);
                if (activeLink) activeLink.classList.add('active');
            }
        };

        // 4. LÓGICA DE LA APP
        const app = {
            init: () => {
                // Listeners de navegación
                document.querySelectorAll('.nav-link[data-target]').forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const target = e.target.getAttribute('data-target');
                        app.router(target);
                    });
                });

                // Listener Login
                const loginForm = document.getElementById('login-form');
                if (loginForm) {
                    loginForm.addEventListener('submit', app.handleLogin);
                }

                // Listener Logout
                const logoutBtn = document.getElementById('logout-btn');
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', () => {
                        signOut(auth).then(() => {
                            UI.toast('Sesión cerrada');
                            window.location.reload();
                        });
                    });
                }
            },

            handleLogin: async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const errorDisplay = document.getElementById('error-msg');

                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    // AuthStateChanged handle el redirect
                } catch (error) {
                    errorDisplay.style.display = 'block';
                    errorDisplay.textContent = "Error: Credenciales inválidas.";
                    console.error(error);
                }
            },

            renderDashboard: () => {
                const container = document.getElementById('modules-container');
                const loading = document.getElementById('loading-dashboard');
                const modules = DataService.getModules();

                loading.style.display = 'none';
                container.innerHTML = '';

                modules.forEach(mod => {
                    const card = document.createElement('div');
                    card.className = 'module-card';
                    card.innerHTML = `
                        <img src="${mod.img}" alt="${mod.title}" class="card-image">
                        <div class="card-content">
                            <div class="card-title">${mod.title}</div>
                            <div class="card-desc">${mod.desc.substring(0, 80)}...</div>
                            <div class="card-footer">
                                <span style="font-size: 0.85rem; color: #94a3b8;">ID: ${mod.id}</span>
                                <button class="btn btn-primary" style="padding: 0.4rem 1rem; font-size: 0.85rem;">Ver Módulo</button>
                            </div>
                        </div>
                    `;
                    card.addEventListener('click', () => app.router('detail', mod.id));
                    container.appendChild(card);
                });
            },

            renderDetail: (id) => {
                const modules = DataService.getModules();
                const module = modules.find(m => m.id == id);
                const wrapper = document.getElementById('detail-content-wrapper');

                if (!module) {
                    wrapper.innerHTML = `<div style="text-align:center; padding: 2rem;"><h3>Módulo no encontrado</h3><button onclick="app.router('dashboard')" class="btn btn-secondary">Volver</button></div>`;
                    return;
                }

                wrapper.innerHTML = `
                    <div class="detail-header">
                        <img src="${module.img}" class="detail-img">
                        <div class="detail-overlay">
                            <h1>${module.title}</h1>
                            <p>ID del módulo: ${module.id}</p>
                        </div>
                    </div>
                    <div class="detail-content">
                        <h3>Descripción Completa</h3>
                        <p style="line-height: 1.8; margin-top: 1rem; color: var(--text-main);">${module.desc}</p>
                        <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #f1f5f9;">
                            <button class="btn btn-primary" onclick="UI.toast('Iniciando módulo...')">Comenzar Lección</button>
                            <button class="btn btn-secondary" onclick="UI.toast('Añadido a favoritos')">Marcar como Favorito</button>
                        </div>
                    </div>
                `;
            },

            router: (route, param = null) => {
                // Chequeo de seguridad simple (auth state)
                if (!auth.currentUser && route !== 'login') return; 

                UI.showView(route);
                
                if (route === 'dashboard') app.renderDashboard();
                if (route === 'detail' && param) app.renderDetail(param);
                if (route === 'admin') admin.renderTable();
            }
        };

        // 5. LÓGICA DE ADMIN (CRUD)
        const admin = {
            renderTable: () => {
                const tbody = document.getElementById('admin-table-body');
                const modules = DataService.getModules();
                tbody.innerHTML = '';

                modules.forEach(mod => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${mod.id}</td>
                        <td><img src="${mod.img}" style="width: 50px; height: 30px; object-fit: cover; border-radius: 4px;"></td>
                        <td><strong>${mod.title}</strong></td>
                        <td style="color: var(--text-light); font-size: 0.9rem;">${mod.desc.substring(0, 40)}...</td>
                        <td class="text-right">
                            <button onclick="admin.editModule(${mod.id})" class="btn btn-secondary btn-icon" style="display:inline-flex; color: var(--primary-color)">✎</button>
                            <button onclick="admin.deleteModule(${mod.id})" class="btn btn-danger btn-icon" style="display:inline-flex;">🗑</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            },

            openModal: (mode = 'create', data = null) => {
                const modal = document.getElementById('crud-modal');
                const title = document.getElementById('modal-title');
                const form = document.getElementById('module-form');

                modal.classList.add('open');
                form.reset();

                if (mode === 'edit' && data) {
                    title.textContent = "Editar Módulo";
                    document.getElementById('module-id').value = data.id;
                    document.getElementById('input-title').value = data.title;
                    document.getElementById('input-desc').value = data.desc;
                    document.getElementById('input-img').value = data.img;
                } else {
                    title.textContent = "Nuevo Módulo";
                    document.getElementById('module-id').value = '';
                }
            },

            closeModal: () => {
                document.getElementById('crud-modal').classList.remove('open');
            },

            saveModule: (e) => {
                e.preventDefault();
                const id = document.getElementById('module-id').value;
                const title = document.getElementById('input-title').value;
                const desc = document.getElementById('input-desc').value;
                const img = document.getElementById('input-img').value;

                if (id) {
                    // Update
                    DataService.update({ id: parseInt(id), title, desc, img });
                    UI.toast('Módulo actualizado correctamente');
                } else {
                    // Create
                    DataService.add({ title, desc, img });
                    UI.toast('Módulo creado exitosamente');
                }
                
                admin.closeModal();
                admin.renderTable();
            },

            editModule: (id) => {
                const modules = DataService.getModules();
                const mod = modules.find(m => m.id == id);
                if (mod) admin.openModal('edit', mod);
            },

            deleteModule: (id) => {
                if(confirm('¿Seguro que quieres eliminar este módulo? Esta acción no se puede deshacer.')) {
                    DataService.delete(id);
                    admin.renderTable();
                    UI.toast('Módulo eliminado', 'error');
                }
            }
        };

        // Listener del form modal
        document.getElementById('module-form').addEventListener('submit', admin.saveModule);

        // Exponer al window para que funcionen los onclick del HTML
        window.app = app;
        window.admin = admin;

        // 6. ESTADO DE AUTENTICACIÓN
        onAuthStateChanged(auth, (user) => {
            const header = document.getElementById('app-header');
            const loginView = document.getElementById('login-view');

            if (user) {
                // Usuario logueado
                header.classList.remove('hidden');
                loginView.classList.remove('active'); // Ocultar login
                
                // Cargar dashboard por defecto si estamos en login
                if (document.getElementById('login-view').style.display !== 'none') {
                    app.router('dashboard');
                }
            } else {
                // No logueado
                header.classList.add('hidden');
                UI.showView('login');
            }
        });

        // Arrancar app
        app.init();

    </script>
</body>
</html>
